name: Qualidade de Código

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Verificação de Estilo (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Executar ESLint
        run: npm run lint

  coverage:
    name: Cobertura de Testes (mínimo 90%)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Executar testes com cobertura
        run: npx jest --coverage --coverageReporters=text --coverageThreshold='{"global":{"lines":90,"statements":90,"branches":90,"functions":85}}'

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
