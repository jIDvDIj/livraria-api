apiVersion: apps/v1
kind: Deployment
metadata:
  name: livraria-api
  labels:
    app: livraria-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: livraria-api
  template:
    metadata:
      labels:
        app: livraria-api
    spec:
      containers:
        - name: livraria-api
          image: jdvdj/livraria-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /api/livros
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/livros
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "30m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
